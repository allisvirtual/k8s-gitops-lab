# Applied once by infra/local/argocd-up.ps1. After that, deploying means pushing to master.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/allisvirtual/k8s-gitops-lab.git
    targetRevision: master
    path: config/charts/demo-api
    helm:
      releaseName: demo-api
      valueFiles:
        - ../../values/local.yaml
      # Separate host so it can run next to the push release on localhost:8080.
      valuesObject:
        ingress:
          host: gitops.localhost
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
