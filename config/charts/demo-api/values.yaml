replicaCount: 2

image:
  repository: demo-api
  # Empty means the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Makes /health fail, to create a broken release for the recovery measurement.
breakHealth: false

service:
  port: 80

ingress:
  enabled: true
  # Set per environment, so the templates stay free of k3s specific fields.
  className: ""
  # Empty matches every host.
  host: ""

probes:
  readiness:
    initialDelaySeconds: 2
    periodSeconds: 2
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3

# Gives the ingress time to stop routing to a pod before it shuts down.
shutdownDelaySeconds: 5

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
