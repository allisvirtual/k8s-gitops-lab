apiVersion: k3d.io/v1alpha5
kind: Simple

metadata:
  name: gitops-lab

servers: 1
agents: 1

# Pinned for reproducible rebuilds. 1.35 and later refuse to start on the
# cgroup v1 that Docker Desktop on WSL2 runs here.
image: rancher/k3s:v1.34.12-k3s1

ports:
  # Traefik, the k3s ingress controller, on http://localhost:8080.
  - port: 8080:80
    nodeFilters:
      - loadbalancer

options:
  k3d:
    wait: true
    timeout: 120s
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
